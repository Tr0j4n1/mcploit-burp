name: Release

# Tag the commit you want to ship and push the tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A tag whose name carries a pre-release suffix (v0.2.0-rc1) is published as a
# GitHub pre-release rather than as the latest version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, for example v0.1.0'
        required: true

# The default token is read-only on this repository. Creating a release and
# uploading the jar both write, and nothing here needs any other scope.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          # A dispatch run has no tag ref of its own, so take the one asked for.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # This repository ships no wrapper, so the version is pinned here
          # instead. Keep it in step with the version named in the README.
          gradle-version: '8.10.2'

      - name: Resolve the release version
        id: release
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A hyphen is the semver pre-release marker: v0.2.0-rc1, v1.0.0-beta.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag matches the versions in the source
        run: |
          set -euo pipefail
          VERSION='${{ steps.release.outputs.version }}'

          BUILD_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' build.gradle.kts)
          CLIENT_VERSION=$(grep -oP 'CLIENT_VERSION\s*=\s*"\K[^"]+' \
            src/main/kotlin/io/mcploit/burp/mcp/McpSession.kt)

          echo "tag              $VERSION"
          echo "build.gradle.kts $BUILD_VERSION"
          echo "CLIENT_VERSION   $CLIENT_VERSION"

          fail=0
          if [ "$BUILD_VERSION" != "$VERSION" ]; then
            echo "::error file=build.gradle.kts::version is $BUILD_VERSION but the tag says $VERSION"
            fail=1
          fi
          # CLIENT_VERSION is what the extension reports to the server in its
          # initialize handshake, so a stale one misidentifies the client in
          # every log on the far side of an engagement.
          if [ "$CLIENT_VERSION" != "$VERSION" ]; then
            echo "::error file=src/main/kotlin/io/mcploit/burp/mcp/McpSession.kt::CLIENT_VERSION is $CLIENT_VERSION but the tag says $VERSION"
            fail=1
          fi
          exit $fail

      - name: Build
        run: gradle --no-daemon shadowJar

      - name: Check the jar is loadable by Burp
        run: |
          set -euo pipefail
          JAR=build/libs/mcploit-burp.jar
          test -f "$JAR"

          # Burp finds the extension through this service file. Without it the
          # jar loads and then does nothing, with no error to explain why.
          SERVICE=META-INF/services/burp.api.montoya.BurpExtension
          unzip -p "$JAR" "$SERVICE" | grep -qx 'io.mcploit.burp.McploitExtension'
          echo "service entry OK"

          # The entry point itself has to be in there under that exact name.
          unzip -l "$JAR" | grep -q 'io/mcploit/burp/McploitExtension.class'
          echo "entry class OK"

          # Gson is relocated on purpose. An unrelocated copy would collide with
          # whatever Burp or another extension already has on the classpath, and
          # the failure shows up at runtime as a confusing NoSuchMethodError.
          if unzip -l "$JAR" | grep -qE ' com/google/gson/'; then
            echo "::error::gson was not relocated, the shadowJar relocate rule is not being applied"
            exit 1
          fi
          unzip -l "$JAR" | grep -q 'io/mcploit/burp/shaded/gson/'
          echo "gson relocation OK"

      - name: Stage the artifact
        id: artifact
        run: |
          set -euo pipefail
          VERSION='${{ steps.release.outputs.version }}'
          mkdir -p dist
          # Versioned on the way out: the build deliberately leaves the version
          # off the filename, which is fine on disk and ambiguous in a download
          # folder holding three of them.
          cp build/libs/mcploit-burp.jar "dist/mcploit-burp-$VERSION.jar"
          cd dist
          sha256sum "mcploit-burp-$VERSION.jar" > "mcploit-burp-$VERSION.jar.sha256"
          echo "sha=$(cut -d' ' -f1 "mcploit-burp-$VERSION.jar.sha256")" >> "$GITHUB_OUTPUT"
          ls -l

      - name: Write the release notes
        run: |
          set -euo pipefail
          VERSION='${{ steps.release.outputs.version }}'
          cat > notes.md <<EOF
          A Burp extension that speaks MCP. Connect to a server, enumerate what it
          exposes, and hand-craft calls against it from inside Burp.

          ## Install

          Burp > Extensions > Installed > Add > Extension type: Java, then select
          \`mcploit-burp-$VERSION.jar\`. A new top-level **MCPloit** tab appears.

          Needs a Burp release whose Montoya API is 2023.12.1 or later.

          ## Verify the download

          \`\`\`
          sha256sum -c mcploit-burp-$VERSION.jar.sha256
          \`\`\`

          \`\`\`
          ${{ steps.artifact.outputs.sha }}  mcploit-burp-$VERSION.jar
          \`\`\`

          ## Build it yourself

          \`\`\`
          gradle shadowJar
          \`\`\`

          Gradle 8.x and JDK 17 or later. This release was built with Gradle
          8.10.2 on \`temurin\` 17 by \`.github/workflows/release.yml\`.
          EOF
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.release.outputs.tag }}'
          VERSION='${{ steps.release.outputs.version }}'

          # Re-running a release should update it rather than fall over.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, replacing its assets"
            gh release upload "$TAG" \
              "dist/mcploit-burp-$VERSION.jar" \
              "dist/mcploit-burp-$VERSION.jar.sha256" \
              --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "MCPloit Client $TAG" \
              --notes-file notes.md \
              --prerelease='${{ steps.release.outputs.prerelease }}' \
              "dist/mcploit-burp-$VERSION.jar" \
              "dist/mcploit-burp-$VERSION.jar.sha256"
          fi

          gh release view "$TAG" --json url,isPrerelease,assets \
            --template 'published {{.url}}  prerelease={{.isPrerelease}}{{"\n"}}{{range .assets}}  {{.name}}  {{.size}} bytes{{"\n"}}{{end}}'
